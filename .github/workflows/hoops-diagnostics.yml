name: Hoops Legacy v0.3 Windows Validated Build

on:
  push:
    branches: [hoops-legacy-diagnostics]
    paths:
      - 'hoops_diag/**'
      - '.github/workflows/hoops-diagnostics.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated v0.2 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf hoops_diag/work
          mkdir -p hoops_diag/work
          cat hoops_diag/chunk00.txt hoops_diag/chunk01.txt hoops_diag/chunk02.txt hoops_diag/chunk03.txt hoops_diag/chunk04.txt > hoops_diag/source.full.b64
          base64 -d hoops_diag/source.full.b64 > hoops_diag/source.zip
          unzip -t hoops_diag/source.zip
          unzip -q hoops_diag/source.zip -d hoops_diag/work
          PROJECT_DIR="$(find hoops_diag/work -maxdepth 2 -name project.godot -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply validated v0.2 startup fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "scripts" / "main.gd"
          s = p.read_text()
          replacements = {
              'var earned := stats.pts * 3 + stats.ast * 4 + stats.reb * 3 + stats.stl * 5 + (35 if won else 12)':
              'var earned: int = int(stats.pts) * 3 + int(stats.ast) * 4 + int(stats.reb) * 3 + int(stats.stl) * 5 + (35 if won else 12)',
              'var bob := abs(sin(player.anim_time * cadence)) * minf(speed * 0.008, 0.035)':
              'var bob: float = absf(sin(float(player.anim_time) * cadence)) * minf(speed * 0.008, 0.035)',
              'var bounce := abs(sin(dribble_clock * (9.4 if holder.velocity.length() > 4.0 else 8.0)))':
              'var bounce: float = absf(sin(dribble_clock * (9.4 if holder.velocity.length() > 4.0 else 8.0)))',
              'var change_side := signf(defender_motion.z) != signf(offset.z) and abs(offset.z) > 0.25':
              'var change_side: bool = signf(defender_motion.z) != signf(offset.z) and absf(offset.z) > 0.25',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Missing expected v0.2 source line: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Apply v0.3 gameplay and presentation patch
        shell: bash
        run: |
          set -euxo pipefail
          echo "8d03b577e1a42c1463df4dd48ff23c7077ee0c7317bfb583eabe08f6352dbc37  hoops_diag/v03_patch_gz_b64.txt" | sha256sum -c -
          base64 -d hoops_diag/v03_patch_gz_b64.txt > hoops_diag/v03.patch.gz
          gzip -dc hoops_diag/v03.patch.gz > hoops_diag/v03.patch
          echo "ac3f128eb751c9d5336329807cd18afc7a1b0249ca21eac716fbdbeb8082dfe1  hoops_diag/v03.patch" | sha256sum -c -
          cd "$PROJECT_DIR"
          patch -p1 --forward < "$GITHUB_WORKSPACE/hoops_diag/v03.patch"
          grep -q 'GAMEPLAY SETTINGS' scripts/main.gd
          grep -q 'func update_finish_action' scripts/main.gd
          grep -q 'func camera_preset_name' scripts/main.gd

      - name: Download official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parser and runtime smoke test
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path "$PROJECT_DIR" --quit --log-file "$GITHUB_WORKSPACE/hoops_diag/editor-v03.log"
          if grep -qEi 'SCRIPT ERROR|Parse Error|Cannot load|Failed to load|Invalid call' "$GITHUB_WORKSPACE/hoops_diag/editor-v03.log"; then
            cat "$GITHUB_WORKSPACE/hoops_diag/editor-v03.log"
            exit 1
          fi
          set +e
          timeout 12s "$GODOT" --headless --path "$PROJECT_DIR" --log-file "$GITHUB_WORKSPACE/hoops_diag/runtime-v03.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          if grep -qEi 'SCRIPT ERROR|Parse Error|Cannot load|Failed to load|Invalid call|ERROR:' "$GITHUB_WORKSPACE/hoops_diag/runtime-v03.log"; then
            cat "$GITHUB_WORKSPACE/hoops_diag/runtime-v03.log"
            exit 1
          fi

      - name: Install official Godot 4.7.2 export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          else
            cp -a /tmp/godot-templates/. "$TEMPLATE_DIR/"
          fi
          test -f "$TEMPLATE_DIR/windows_release_x86_64.exe"

      - name: Configure Windows x64 export
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/HoopsLegacy.exe"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=0
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          shader_baker/enabled=false
          binary_format/architecture="x86_64"
          codesign/enable=false
          application/modify_resources=true
          application/icon=""
          application/console_wrapper_icon=""
          application/icon_interpolation=4
          application/file_version="0.3.0.0"
          application/product_version="0.3.0.0"
          application/company_name=""
          application/product_name="Hoops Legacy"
          application/file_description="Hoops Legacy v0.3 Gameplay and Camera Playtest"
          application/copyright=""
          application/trademarks=""
          EOF

      - name: Export real Windows x64 release
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          BUILD_DIR="$GITHUB_WORKSPACE/hoops_diag/windows-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          "$GODOT" --headless --path "$PROJECT_DIR" --export-release "Windows Desktop" "$BUILD_DIR/HoopsLegacy.exe" --log-file "$GITHUB_WORKSPACE/hoops_diag/export-v03.log"
          test -s "$BUILD_DIR/HoopsLegacy.exe"
          test -s "$BUILD_DIR/HoopsLegacy.pck"
          file "$BUILD_DIR/HoopsLegacy.exe"
          sha256sum "$BUILD_DIR/HoopsLegacy.exe" "$BUILD_DIR/HoopsLegacy.pck" > "$BUILD_DIR/SHA256SUMS.txt"
          cat > "$BUILD_DIR/START_HERE.txt" <<'EOF'
          HOOPS LEGACY v0.3 - GAMEPLAY + CAMERA PLAYTEST

          Double-click HoopsLegacy.exe.
          Keep HoopsLegacy.exe and HoopsLegacy.pck together.

          New in this build:
          - 2K / High / Broadcast / Drive camera presets
          - zoom and height camera settings
          - camera motion and action-shake toggles
          - shot feedback toggle
          - smoother analog acceleration, braking, first-step burst and plants
          - upgraded defensive stance and on-ball protect/size-up movement
          - smoother dribble ball paths and body reactions
          - improved footwork, arm swing, shot poses and finish animations
          - player-lock ring and contact shadows
          - more active CPU spacing, cuts and passing decisions
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: hoops-v03-windows-candidate
          path: hoops_diag/windows-build/
          if-no-files-found: error
          compression-level: 6

  windows-smoke-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hoops-v03-windows-candidate
          path: build

      - name: Verify and launch actual Windows executable
        shell: pwsh
        run: |
          Get-ChildItem build
          if (-not (Test-Path "build\HoopsLegacy.exe")) { throw "HoopsLegacy.exe missing" }
          if (-not (Test-Path "build\HoopsLegacy.pck")) { throw "HoopsLegacy.pck missing" }
          $proc = Start-Process -FilePath "$PWD\build\HoopsLegacy.exe" -ArgumentList "--headless","--quit-after","180","--log-file","$PWD\build\windows-runtime-v03.log" -Wait -PassThru
          Write-Host "Windows process exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            if (Test-Path "build\windows-runtime-v03.log") { Get-Content "build\windows-runtime-v03.log" }
            throw "Windows executable returned non-zero exit code."
          }
          if (Test-Path "build\windows-runtime-v03.log") {
            Get-Content "build\windows-runtime-v03.log"
            $bad = Select-String -Path "build\windows-runtime-v03.log" -Pattern "SCRIPT ERROR|Parse Error|Cannot load|Failed to load|Invalid call|ERROR:" -CaseSensitive:$false
            if ($bad) { throw "Godot reported an error during the Windows smoke test." }
          }

      - name: Package validated playtest
        shell: pwsh
        run: |
          Remove-Item "build\windows-runtime-v03.log" -ErrorAction SilentlyContinue
          Compress-Archive -Path "build\*" -DestinationPath "HoopsLegacy-v0.3.0-Gameplay-Camera-Windows-x64-VALIDATED.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: HoopsLegacy-v0.3.0-Gameplay-Camera-Windows-x64-VALIDATED
          path: HoopsLegacy-v0.3.0-Gameplay-Camera-Windows-x64-VALIDATED.zip
          if-no-files-found: error
          compression-level: 0
